# All strategy knobs live here. Edit and restart the bot.
#
# QUICK START (beginner): leave everything alone and run `./run.sh`.
# Defaults: paper-trade BTC 15m (with ETH and SOL fallback) during US session,
# $100 starting equity, 2.5% daily loss kill switch, $20 max per trade.

# ---------- Trading session ----------
# Bot only trades during these hours/days. Outside the window it sits idle
# and polls every off_hours_poll_sec. The default window covers US market
# hours and after-hours when crypto liquidity is highest.
session:
  enabled_hours_utc_start: 13   # 13:00 UTC = 09:00 ET
  enabled_hours_utc_end: 25     # 25 == 01:00 next day UTC = 21:00 ET
  enabled_weekdays: [0, 1, 2, 3, 4]   # Mon-Fri (0=Mon, 6=Sun). Add 5,6 to allow weekends.
  off_hours_poll_sec: 300

# ---------- Which market to trade ----------
market:
  recurring:
    enabled: true
    # Tried in priority order. First active match wins. Switch the order to
    # prefer ETH or SOL, or remove templates you don't want.
    slug_templates:
      - "btc-updown-15m-{start_unix}"
      - "eth-updown-15m-{start_unix}"
      - "sol-updown-15m-{start_unix}"
    period_sec: 900               # 15 minutes

  # Pin a single fixed market (used only when recurring.enabled = false).
  slug: ""
  # Or skip Gamma lookup entirely with explicit token IDs.
  yes_token_id: ""
  no_token_id: ""

# ---------- Spot momentum signal ----------
spot:
  symbol: "BTCUSDT"
  short_lookback_minutes: 2       # fast momentum window (1-3 min per spec)
  long_lookback_minutes: 5        # slow window for direction confirmation
  alignment_threshold: 0.0001     # 0.01%: very loose — basically any directional move (was 0.0005, was 0.0035)
  rsi_period: 14
  volume_lookback_minutes: 20     # baseline for volume_ratio

# ---------- Three-rule strategy ----------
strategy:
  tick_interval_sec: 30
  endgame_tick_interval_sec: 10

  # Rule: scout entry — buy the small-probability (cheap) side as first leg.
  # Per user strategy: buy extreme underdog (e.g. Up @ 4¢), wait for it to
  # rebound (Up rises to 10¢, Down drops to 81¢), then LOCK_SPREAD locks the
  # 4¢ + 81¢ = 85¢ cost basis vs. $1 settlement = $0.15 / pair profit.
  scout_max_price: 0.47           # buy underdog up to 47c (user: not just 4c extremes)
  scout_min_remaining_sec: 480    # 8 minutes
  scout_size_usd: 10.0
  # Momentum filter for SCOUT: aligned | counter | none.
  # "none" matches user's "buy any cheap underdog" intent — recommended.
  # "aligned" requires momentum to agree with cheap side (almost never fires
  #   because underdog is cheap precisely BECAUSE momentum is against it).
  # "counter" requires momentum to disagree with cheap side (overreaction signal).
  scout_momentum_mode: "none"

  # Rule: lock spread / complement (middle window — remaining > 4 min)
  arb_total_threshold: 0.97
  arb_min_remaining_sec: 240      # 4 minutes
  min_profit_after_fees: 0.025

  # Rule: endgame (last 4 minutes)
  endgame_remaining_sec: 240
  endgame_hedge_ratio: 0.5
  unbalanced_threshold_usd: 1.0

  # Rule: stop-loss (anytime). 0 disables.
  stop_loss_pct: 0.015            # close losing leg if it's down >1.5%

  # Rule: inverted-book early exit (anytime). 0 disables.
  # Fires when YES+NO total exceeds the threshold AND spot has reversed
  # against our larger position by more than inverted_spot_reversal_pct.
  inverted_total_threshold: 1.02
  inverted_spot_reversal_pct: 0.003   # 0.3% spot reversal vs entry

# ---------- Fees & slippage assumed for paper fills ----------
fees:
  per_side_fee_rate: 0.0          # Polymarket currently 0% taker
  slippage_estimate: 0.008        # 0.8% — only used when book is unavailable

# ---------- Execution quality guards ----------
execution_quality:
  max_spread: 0.04                # refuse fills with bid-ask > 4 cents
  min_depth_usd: 50.0             # need >=$50 resting within 1% of best ask

# ---------- Risk guardrails ----------
risk:
  # Stricter of (pct, usd) wins. Set either to 0 to disable that lever.
  daily_max_loss_pct: 0.025       # 2.5% of starting equity (= $2.50 on $100)
  daily_max_loss_usd: 0.0
  min_cash_floor_usd: 5.0
  max_single_trade_usd: 20.0

# ---------- Execution mode ----------
execution:
  mode: "paper"                   # "paper" | "live" (live not implemented yet)
  paper_starting_balance_usd: 100.0

# ---------- Logging ----------
logging:
  level: "INFO"
  summary_interval_sec: 60
